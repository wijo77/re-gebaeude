     und unten im Abschnitt "1. KONFIGURATION" einfügen.
  5. Datei als index.html in ein GitHub-Repo legen -> in Vercel importieren.

  (lokal im Browser, mehrere Tabs desselben Browsers werden synchronisiert).
  =====================================================================
-->

/* =====================================================================
   4. DATENBANK-ADAPTER  (Firebase oder lokaler Demo-Modus)
   Alle Team-Zustände werden als JSON-String gespeichert. Grund: Firebase
   löscht leere Arrays/Objekte und null-Werte -> so bleibt alles stabil.
   ===================================================================== */
class FireDB {
  constructor(cfg) {
    firebase.initializeApp(cfg);
    this.db = firebase.database();
    this.mode = 'firebase';
    this.offset = 0;
    this.db.ref('.info/serverTimeOffset').on('value', s => { this.offset = s.val() || 0; });
  }
  ref(p) { return this.db.ref(p ? DB_ROOT + '/' + p : DB_ROOT); }
  listen(p, cb) { this.ref(p).on('value', s => cb(s.val())); }
  set(p, v) { return this.ref(p).set(v); }
  update(p, o) { return this.ref(p).update(o); }
  remove(p) { return this.ref(p).remove(); }
  push(p, v) { return this.ref(p).push(v); }
  get(p) { return this.ref(p).once('value').then(s => s.val()); }
  // applyLocally = false -> keine Zwischenstände im UI (verhindert Flackern)
  txn(p, fn) { return this.ref(p).transaction(fn, null, false).then(r => ({ committed: r.committed, value: r.snapshot ? r.snapshot.val() : null })); }
  TS() { return firebase.database.ServerValue.TIMESTAMP; }
  now() { return Date.now() + this.offset; }
  onConnection(cb) { this.db.ref('.info/connected').on('value', s => cb(!!s.val())); }
}

class MemoryDB {
  constructor() {
    this.mode = 'demo'; this.tree = {}; this.ls = []; this.counter = 0;
    try {
      this.ch = new BroadcastChannel('regebaeude-demo');
      this.ch.onmessage = e => this._onMsg(e.data);
      this.ch.postMessage({ op: 'hello' });
    } catch (e) { this.ch = null; }
  }
  _parts(p) { return String(p || '').split('/').filter(Boolean); }
  _get(p) {
    let n = this.tree;
    for (const k of this._parts(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; }
    return n === undefined ? null : n;
  }
  _set(p, v) {
    const parts = this._parts(p);
    v = v == null ? null : clone(v);
    if (!parts.length) { this.tree = v || {}; return; }
    let n = this.tree; const stack = [];
    for (let i = 0; i < parts.length - 1; i++) {
      const k = parts[i];
      if (n[k] == null || typeof n[k] !== 'object') n[k] = {};
      stack.push([n, k]); n = n[k];
    }
    const last = parts[parts.length - 1];
    if (v === null) delete n[last]; else n[last] = v;
    for (let i = stack.length - 1; i >= 0; i--) {
      const [par, k] = stack[i];
      if (par[k] && typeof par[k] === 'object' && !Object.keys(par[k]).length) delete par[k];
    }
  }
  _notify(p) {
    const cp = this._parts(p).join('/');
    this.ls.forEach(l => {
      if (cp === '' || l.p === '' || cp === l.p || cp.startsWith(l.p + '/') || l.p.startsWith(cp + '/')) l.cb(clone(this._get(l.p)));
    });
  }
  _write(p, v, remote) {
    this._set(p, v);
    if (!remote && this.ch) this.ch.postMessage({ op: 'set', p, v: v == null ? null : clone(v) });
    this._notify(p);
  }
  _onMsg(d) {
    if (!d) return;
    if (d.op === 'set') { this._set(d.p, d.v); this._notify(d.p); }
    else if (d.op === 'hello') { if (Object.keys(this.tree).length && this.ch) this.ch.postMessage({ op: 'full', tree: this.tree }); }
    else if (d.op === 'full') { if (!Object.keys(this.tree).length) { this.tree = clone(d.tree) || {}; this._notify(''); } }
  }
  listen(p, cb) { const l = { p: this._parts(p).join('/'), cb }; this.ls.push(l); setTimeout(() => cb(clone(this._get(p))), 0); }
  set(p, v) { this._write(p, v); return Promise.resolve(); }
  update(p, o) { Object.keys(o).forEach(k => this._write(p + '/' + k, o[k])); return Promise.resolve(); }
  remove(p) { this._write(p, null); return Promise.resolve(); }
  push(p, v) { const k = 'k' + String(Date.now()).padStart(15, '0') + String(this.counter++).padStart(6, '0'); this._write(p + '/' + k, v); return Promise.resolve(k); }
  get(p) { return Promise.resolve(clone(this._get(p))); }
  txn(p, fn) {
    const nv = fn(clone(this._get(p)));
    if (nv === undefined) return Promise.resolve({ committed: false, value: null });
    this._write(p, nv);
    return Promise.resolve({ committed: true, value: clone(nv) });
  }
  TS() { return Date.now(); }
  now() { return Date.now(); }
}

let DB = null;
function createDB() {
  const placeholder = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('DEIN') === 0;
  if (!placeholder && typeof firebase !== 'undefined') {
    try { return new FireDB(firebaseConfig); } catch (e) { console.error('Firebase-Fehler, wechsle in Demo-Modus', e); }
  }
  return new MemoryDB();
}

const state = {
  role: null, team: null, connected: false,
  game: null, teams: { t1: null, t2: null, t3: null, t4: null },
  sel: [], delSel: [], selKey: '',
  bf: { strom: '', gas: '', diesel: '' }, bfErr: {},
  dismissed: {}, qSeen: {}, lastExpired: null,
  qSel: '1-0', qSelRound: -1,

function normGame(g) {
  g = g || {};
  return {
    round: Number(g.round) || 0,
    open: !!g.open,
    rankings: g.rankings || {},
    sent: g.sent || {},
    q: g.q ? Object.assign({ results: {} }, g.q, { results: g.q.results || {} }) : null
  };
}
state.game = normGame(null);
const G = () => state.game;

function defaultTeam(name) {
  return { name: name || '', pos: 1, budget: 0, bilanz: false, cons: Object.assign({}, START), co2: START_CO2,
           chosen: {}, impl: {}, rs: {}, deleted: [], delDone: false, cards: [], usedE: [], usedT: [], answer: null, log: [], undo: [] };
}
function parseTeam(str) {
  if (!str) return null;
  try { return Object.assign(defaultTeam(''), typeof str === 'string' ? JSON.parse(str) : str); } catch (e) { return null; }
}
const teamLabel = id => `Team ${TEAM_META[id].n}`;
const teamName = id => (state.teams[id] && state.teams[id].name) ? `${teamLabel(id)} · ${state.teams[id].name}` : teamLabel(id);

function allChosen(t) { return Object.keys(t.chosen).reduce((a, k) => a.concat(t.chosen[k] || []), []); }
function has(t, id, extra) { return allChosen(t).includes(id) || (extra || []).includes(id); }

/* Effektive Werte einer Maßnahme (Bedingungen der Kartenrückseite) */
function effective(m, t, sel) {
  let cost = m.cost, sav = Object.assign({}, m.sav), co2 = m.co2, bonus = m.bonus, note = '';
  if (m.id === 'C3' && !has(t, 'A5', sel)) { cost += 5000; sav = { strom: 30000 }; co2 = 18000; bonus = 3500; note = 'Ohne Beleuchtungskonzept: +5.000 € und geringere Einsparung.'; }
  if (m.id === 'E4' && !has(t, 'A3', sel)) { cost += 5000; note = 'Ohne Heizungskonzept: Mehrkosten 5.000 €.'; }
  const kwh = (sav.strom || 0) + (sav.gas || 0) + (sav.diesel || 0);
  return { cost, sav, co2, bonus, kwh, note };
}

function roundPool(t, r) {
  const pool = ROUNDS[r].own.slice();
  if (r === 2) ROUNDS[1].own.forEach(id => { if (!(t.chosen[1] || []).includes(id)) pool.push(id); });
  if (r === 4) leftover2(t).forEach(id => { if (!t.deleted.includes(id)) pool.push(id); });
  return pool;
}
function leftover2(t) { return roundPool(t, 2).filter(id => !(t.chosen[2] || []).includes(id)); }

function validateSel(t, r, sel) {
  const R = ROUNDS[r]; const pool = roundPool(t, r);
  if (sel.some(id => !pool.includes(id))) return 'Ungültige Karte in der Auswahl.';
  if (sel.length > R.pick) return `Maximal ${R.pick} Karten.`;
  if (sel.length < R.min) return R.min === R.pick ? `Bitte genau ${R.pick} Karten wählen.` : `Bitte mindestens ${R.min} Karte wählen.`;
  for (const [cat, label] of R.req) if (!sel.some(id => MBY[id].cat === cat)) return `Mindestens eine Maßnahme aus dem Bereich ${label} ist Pflicht.`;
  const base = sel.reduce((s, id) => s + effective(MBY[id], t, sel).cost, 0);
  const avail = r === 3 ? R3_BUDGET : t.budget;
  if (base > avail) return 'Das Budget reicht nicht aus.';
  return null;
}
function canSelect(t, r) {
  const g = G();
  if (r < 1 || r > 4 || !g.open || !t.bilanz || t.chosen[r]) return false;
  if (r === 4 && t.chosen[2] && !t.delDone) return false;
  return true;
}

function addLog(t, msg) { t.log.push({ ts: Date.now(), m: msg }); if (t.log.length > 25) t.log = t.log.slice(-25); }

function moveTeam(t, delta, trigger) {
  const from = t.pos;
  t.pos = Math.max(1, Math.min(FIELDS, t.pos + delta));
  if (trigger && t.pos !== from) {
    if (EVENT_FIELDS.includes(t.pos)) t.cards.push({ type: 'E', field: t.pos, st: 'ready' });
    else if (TEAM_FIELDS.includes(t.pos)) t.cards.push({ type: 'T', field: t.pos, st: 'ready' });
  }
  return t.pos - from;
}

/* Jede Änderung an einem Team läuft als Transaktion.
   label != null -> vorheriger Zustand wird in die Historie gelegt (für Undo). */
async function teamTxn(tid, mutator, label) {
  const res = await DB.txn('state/' + tid, cur => {
    if (cur == null) return undefined;
    const t = parseTeam(cur); if (!t) return undefined;
    const snapshot = label ? clone(t) : null;
    if (snapshot) delete snapshot.undo;     // Snapshot VOR der Änderung, ohne rekursive Historie
    if (mutator(t) === false) return undefined;
    if (label) {
      t.undo = Array.isArray(t.undo) ? t.undo : [];
      t.undo.push({ s: JSON.stringify(snapshot), l: label, ts: Date.now() });
      if (t.undo.length > 30) t.undo.shift();
    }
    return JSON.stringify(t);
  });
  return res.committed;
}

async function guarded(fn) {
  if (state.busy) return;
  state.busy = true;
  try { await fn(); } finally { state.busy = false; scheduleRender(); }
}

/* ---------- Team-Aktionen ---------- */
async function joinTeam() {
  const tid = state.team; const name = (state.nameInput || '').trim().slice(0, 30) || teamLabel(tid);
  await DB.txn('state/' + tid, cur => (cur ? cur : JSON.stringify(defaultTeam(name))));
}

async function checkBilanz() {
  const parse = v => Number(String(v || '').replace(/[^\d]/g, ''));
  const errs = {};
  Object.keys(START).forEach(k => { if (parse(state.bf[k]) !== START[k]) errs[k] = true; });
  state.bfErr = errs;
  if (Object.keys(errs).length) { render(); return; }
  await teamTxn(state.team, t => {
    if (t.bilanz || G().round < 1) return false;
    t.bilanz = true; t.budget += START_BUDGET;
    moveTeam(t, 3, true);
    addLog(t, 'Energiebilanz korrekt erstellt: +3 Felder, 100.000 € Startbudget');
  }, 'Energiebilanz');
}

async function submitMeasures() {
  const r = G().round; const sel = state.sel.slice();
  const ok = await teamTxn(state.team, t => {
    if (!canSelect(t, r) || validateSel(t, r, sel)) return false;
    let cost = 0, bonus = 0, kwh = 0, co2 = 0; const sav = { strom: 0, gas: 0, diesel: 0 };
    sel.forEach(id => {
      const e = effective(MBY[id], t, sel);
      t.impl[id] = Object.assign({ r }, e);
      cost += e.cost; bonus += e.bonus; kwh += e.kwh; co2 += e.co2;
      Object.keys(e.sav).forEach(k => { sav[k] += e.sav[k]; });
    });
    t.chosen[r] = sel;
    if (r !== 3) t.budget -= cost;           // Runde 3: Kosten aus dem IKT-Sonderbudget
    t.budget += bonus;                       // erspieltes Budget geht ins Hauptbudget
    Object.keys(sav).forEach(k => { t.cons[k] -= sav[k]; });
    t.co2 -= co2;
    t.rs[r] = { kwh, co2, cost, bonus };
    if (r === 3) roundPool(t, 3).forEach(id => { if (!sel.includes(id) && !t.deleted.includes(id)) t.deleted.push(id); });
    addLog(t, `Runde ${r}: ${sel.join(', ')} umgesetzt (${fmt(kwh)} kWh, ${fmt(co2)} kg CO₂)`);
  }, `Maßnahmen Runde ${r}`);
  if (ok) state.sel = [];
}

async function submitDeletion() {
  const ids = state.delSel.slice();
  const ok = await teamTxn(state.team, t => {
    if (!t.chosen[2] || t.delDone) return false;
    const lo = leftover2(t); const need = Math.max(0, lo.length - 4);
    if (ids.length !== need || ids.some(id => !lo.includes(id))) return false;
    ids.forEach(id => t.deleted.push(id));
    t.delDone = true;
    addLog(t, `Karten abgegeben: ${ids.join(', ') || '–'}`);
  }, 'Karten abgeben');
  if (ok) state.delSel = [];
}

function applyEvent(t, e) {
  if (e.move) moveTeam(t, e.move, false);
  if (e.budget) t.budget += e.budget;
  if (e.strom) { t.cons.strom += e.strom; t.co2 += Math.round(e.strom * EF.strom); }
}

async function drawCard() {
  await teamTxn(state.team, t => {
    const c = t.cards[0];
    if (!c || c.st !== 'ready') return false;
    if (c.type === 'E') {
      let avail = EVENTS.filter(e => !t.usedE.includes(e.id));
      if (!avail.length) { t.usedE = []; avail = EVENTS.slice(); }
      const e = pickRandom(avail); t.usedE.push(e.id); c.id = e.id;
      applyEvent(t, e); c.st = 'done';
      addLog(t, `Ereigniskarte ${e.id}: ${e.effect}`);
    } else {
      let avail = TEAMCARDS.filter(x => !t.usedT.includes(x.id));
      if (!avail.length) { t.usedT = []; avail = TEAMCARDS.slice(); }
      const tc = pickRandom(avail); t.usedT.push(tc.id); c.id = tc.id;
      if (tc.type === 'auto') {
        const yes = tc.check.some(id => has(t, id));
        c.ok = yes; moveTeam(t, yes ? tc.yes : tc.no, false); c.st = 'done';
        addLog(t, `Teamkarte ${tc.id}: ${yes ? 'Ja' : 'Nein'} (${yes ? '+' + tc.yes : tc.no} Felder)`);
      } else {
        c.st = 'await';
        addLog(t, `Teamkarte ${tc.id} gezogen – wartet auf Bewertung`);
      }
    }
  }, 'Karte gezogen');
}

async function ackCard() {
  await teamTxn(state.team, t => { if (!t.cards[0] || t.cards[0].st !== 'done') return false; t.cards.shift(); }, null);
}

async function answerQuestion(c) {
  const q = G().q; if (!q || q.status !== 'open' || isExpired(q)) return;
  await teamTxn(state.team, t => { if (t.answer && t.answer.qid === q.id) return false; t.answer = { qid: q.id, c }; }, null);
}

async function ensureGame() { await DB.txn('game', cur => (cur ? undefined : { round: 0, open: false })); }

async function setRound(r) {
  const g = G();
  let msg = r === 5 ? 'Spiel beenden und Sieger anzeigen?' : r === 0 ? 'Zurück in die Lobby?' : `Runde ${r} starten?`;
  if (g.round >= 1 && g.round <= 4 && !g.rankings[g.round] && r > g.round) msg += `\n\nAchtung: Das Ranking für Runde ${g.round} wurde noch nicht ausgewertet.`;
  if (!confirm(msg)) return;
  await DB.update('game', { round: r, open: false, q: null });
}

async function sendQuestion() {
  const [r, i] = state.qSel.split('-').map(Number);
  const g = G();
  if (g.q && g.q.status === 'open' && !confirm('Es läuft noch eine Frage. Trotzdem ersetzen?')) return;
  const id = `${r}-${i}-${Date.now()}`;
  await DB.set('game/q', { id, r, i, sentAt: DB.TS(), status: 'open' });
  await DB.set('game/sent/' + r + '-' + i, true);
}

async function revealQuestion() {
  const q = G().q; if (!q || q.status !== 'open') return;
  const correct = QUESTIONS[q.r].items[q.i].c;
  let results = null;
  const res = await DB.txn('game/q', cur => {
    if (!cur || cur.id !== q.id || cur.status !== 'open') return undefined;
    results = {};
    TEAMS.forEach(tid => { const t = state.teams[tid]; if (t && t.answer && t.answer.qid === cur.id) results[tid] = t.answer.c === correct; });
    cur.status = 'revealed'; cur.results = results;
    return cur;
  });
  if (!res.committed || !results) return;
  for (const tid of Object.keys(results)) {
    if (!results[tid]) continue;
    await teamTxn(tid, t => { moveTeam(t, 1, true); addLog(t, `Fragerunde ${q.r}, Frage ${q.i + 1} richtig: +1 Feld`); }, `Frage ${q.r}.${q.i + 1} richtig`);
  }
}

async function closeQuestion() { if (G().q) await DB.update('game/q', { status: 'closed' }); }

function computeRanking(r) {
  const list = TEAMS.filter(id => state.teams[id]).map(id => {
    const t = state.teams[id]; const s = t.rs[r] || { kwh: 0, co2: 0 };
    return { id, name: t.name, kwh: s.kwh, co2: s.co2, done: !!t.chosen[r] };
  });
  list.forEach(a => {
    a.rk = 1 + list.filter(b => b.kwh > a.kwh).length;   // Platz im Energie-Ranking
    a.rc = 1 + list.filter(b => b.co2 > a.co2).length;   // Platz im CO2-Ranking
    a.sum = a.rk + a.rc;                                 // Rangsumme
  });
  const cmp = (a, b) => (a.sum - b.sum) || (b.kwh - a.kwh) || (b.co2 - a.co2);
  list.sort(cmp);
  list.forEach(a => { a.place = 1 + list.filter(b => cmp(b, a) < 0).length; a.fields = Math.max(1, 5 - a.place); });
  return list;
}

async function evaluateRanking() {
  const g = G(); const r = g.round; if (r < 1 || r > 4) return;
  const list = computeRanking(r);
  if (!list.length) { alert('Es sind noch keine Teams beigetreten.'); return; }
  if (g.rankings[r] && !confirm(`Das Ranking für Runde ${r} wurde bereits ausgewertet. Nochmals auswerten (Teams rücken erneut vor)?`)) return;
  const missing = list.filter(a => !a.done);
  if (missing.length && !confirm(`Noch keine Maßnahmen abgegeben: ${missing.map(a => teamName(a.id)).join(', ')}.\nDiese Teams werden mit 0 Einsparung gewertet. Fortfahren?`)) return;
  for (const a of list) {
    await teamTxn(a.id, t => { moveTeam(t, a.fields, true); addLog(t, `Ranking Runde ${r}: Platz ${a.place}, +${a.fields} Felder`); }, `Ranking Runde ${r}`);
  }
  await DB.set('game/rankings/' + r, JSON.stringify(list.map(a => ({ id: a.id, name: a.name, kwh: a.kwh, co2: a.co2, rk: a.rk, rc: a.rc, sum: a.sum, place: a.place, fields: a.fields }))));
}

async function undoTeam(tid) {
  const current = parseTeam(await DB.get('state/' + tid));
  const stack = current && Array.isArray(current.undo) ? current.undo : [];
  if (!stack.length) { alert('Für dieses Team gibt es keinen Schritt zum Rückgängigmachen.'); return; }
  const entry = stack[stack.length - 1];
  if (!confirm(`${teamName(tid)}: Letzten Schritt „${entry.l}“ rückgängig machen?`)) return;
  const res = await DB.txn('state/' + tid, cur => {
    const latest = parseTeam(cur);
    const hist = latest && Array.isArray(latest.undo) ? latest.undo : [];
    if (!hist.length || hist[hist.length - 1].l !== entry.l || hist[hist.length - 1].ts !== entry.ts) return undefined;
    const restored = parseTeam(hist[hist.length - 1].s);
    if (!restored) return undefined;
    restored.undo = hist.slice(0, -1);
    return JSON.stringify(restored);
  });
  if (!res.committed) alert('Der Teamstand hat sich zwischenzeitlich geändert. Bitte prüfe das Team und versuche es erneut.');
}

async function judgeTeamCard(tid, ok) {
  await teamTxn(tid, t => {
    const c = t.cards[0]; if (!c || c.st !== 'await') return false;
    const tc = TEAMCARDS.find(x => x.id === c.id);
    c.ok = ok; moveTeam(t, ok ? tc.yes : tc.no, false); c.st = 'done';
    addLog(t, `Teamkarte ${tc.id} ${ok ? 'richtig' : 'falsch'} (${ok ? '+' + tc.yes : tc.no} Felder)`);
  }, 'Teamkarte bewertet');
}

async function manualMove(tid, d) {
  await teamTxn(tid, t => { moveTeam(t, d, false); addLog(t, `Korrektur durch Spielleitung: ${d > 0 ? '+' : ''}${d} Feld`); }, 'Korrektur Spielleitung');
}

async function resetGame() {
  if (!confirm('Das gesamte Spiel wird gelöscht (alle Teams, Fortschritte und Historie). Fortfahren?')) return;
  if (!confirm('Wirklich sicher? Das kann nicht rückgängig gemacht werden.')) return;
  await DB.remove('');
  await DB.set('game', { round: 0, open: false });
  state.dismissed = {};
}

/* ---------- Timer (lokal, Date.now() + Server-Offset) ---------- */
function remaining(q) {
  let start = typeof q.sentAt === 'number' ? q.sentAt : null;
  if (start == null) { if (!state.qSeen[q.id]) state.qSeen[q.id] = DB.now(); start = state.qSeen[q.id]; }
  const r = QUESTION_SECONDS - (DB.now() - start) / 1000;
  return Math.max(0, Math.min(QUESTION_SECONDS, r));
}
function isExpired(q) { return !q || q.status !== 'open' || remaining(q) <= 0; }
const fmtTime = s => { const x = Math.ceil(s); return `0:${String(x).padStart(2, '0')}`.replace('0:60', '1:00'); };

   6. RENDERING  (regionsweise, nur bei Änderung -> kein Flackern)

let lastView = null; const sigs = {};
function region(id, sig, htmlFn) {
  const el = document.getElementById(id); if (!el) return;
  if (sigs[id] === sig) return;
  sigs[id] = sig; el.innerHTML = htmlFn();
}
let renderQueued = false;
function scheduleRender() {
  if (typeof document === 'undefined' || renderQueued) return;
  renderQueued = true;
  (window.requestAnimationFrame || (f => setTimeout(f, 16)))(() => { renderQueued = false; render(); });
}

function boardHeaderHTML() {

}
function fieldRC(f) {
  const i = f - 1, row = Math.floor(i / 10), idx = i % 10;
  return { row: 6 - row, col: row % 2 === 0 ? idx + 1 : 10 - idx, dir: (idx === 9) ? 'up' : (row % 2 === 0 ? 'right' : 'left') };
}
function buildBoard() {
  const el = document.getElementById('board'); if (!el) return;
  let html = '<div class="grid grid-cols-10 gap-1 sm:gap-1.5">';
  for (let f = 1; f <= FIELDS; f++) {
    const { row, col, dir } = fieldRC(f);
    let cls = 'bg-slate-100 text-slate-500 border-slate-200', label = '';
    if (f === 1) { cls = 'bg-eco-600 text-white border-eco-700'; label = 'Start'; }
    else if (f === FIELDS) { cls = 'bg-eco-800 text-white border-eco-900'; label = 'Ziel'; }
    else if (EVENT_FIELDS.includes(f)) { cls = 'bg-red-500 text-white border-red-600'; label = 'Ereignis'; }
    else if (TEAM_FIELDS.includes(f)) { cls = 'bg-purple-500 text-white border-purple-600'; label = 'Team'; }
    const arrow = f === FIELDS ? '' : (dir === 'up' ? '▲' : dir === 'right' ? '▶' : '◀');
    html += `<div data-f="${f}" class="relative h-12 sm:h-14 rounded-lg border ${cls} flex flex-col items-center justify-center select-none" style="grid-row:${row};grid-column:${col}">
      <span class="text-sm sm:text-base font-extrabold leading-none">${f}</span>
      ${label ? `<span class="text-[9px] sm:text-[10px] font-semibold uppercase tracking-wide opacity-90 leading-tight">${label}</span>` : ''}
      <span class="absolute bottom-0.5 right-1 text-[8px] opacity-40">${arrow}</span></div>`;
  }
  html += '</div>';
  TEAMS.forEach(id => { const m = TEAM_META[id]; html += `<div id="tok-${id}" class="token hidden" style="background:${m.color};color:${m.fg}">${m.n}</div>`; });
  el.innerHTML = html;
}
function positionTokens() {
  const board = document.getElementById('board'); if (!board) return;
  TEAMS.forEach((id, i) => {
    const tok = document.getElementById('tok-' + id); if (!tok) return;
    const t = state.teams[id];
    if (!t) { tok.classList.add('hidden'); return; }
    tok.classList.remove('hidden');
    tok.classList.toggle('me', state.role === 'team' && state.team === id);
    const fe = board.querySelector(`[data-f="${t.pos}"]`); if (!fe) return;
    const size = tok.offsetWidth || 22;
    const off = [[-1, -1], [1, -1], [-1, 1], [1, 1]][i];
    const d = Math.min(fe.offsetWidth, fe.offsetHeight) * 0.26;
    const x = fe.offsetLeft + fe.offsetWidth / 2 + off[0] * d - size / 2;
    const y = fe.offsetTop + fe.offsetHeight / 2 + off[1] * d - size / 2;
    const tr = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    if (tok.style.transform !== tr) tok.style.transform = tr;
    tok.title = `${teamName(id)} – Feld ${t.pos}`;
  });
}
let boardObserver = null;
function observeBoard() {
  const b = document.getElementById('board'); if (!b || typeof ResizeObserver === 'undefined') return;
  if (boardObserver) boardObserver.disconnect();
  boardObserver = new ResizeObserver(() => positionTokens()); boardObserver.observe(b);
}

      <div class="flex justify-between items-center mb-1"><b>Runde ${x} · ${ROUNDS[x].title}</b><span class="text-[11px] px-2 py-0.5 rounded-full ${cur ? 'bg-eco-600 text-white' : 'bg-slate-400 text-white'}">${cur ? 'diese Runde' : 'aktiviert'}</span></div>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-500"><tr><th class="text-left">Nr.</th><th class="text-left">Maßnahme</th><th class="text-right">Kosten</th><th class="text-right">kWh/a</th><th class="text-right">kg CO₂/a</th><th class="text-right">Budget</th></tr></thead>
      <tbody>${rows}<tr class="border-t-2 border-slate-300 font-bold"><td></td><td>Summe${x === 3 ? ' (Kosten aus IKT-Sonderbudget)' : ''}</td><td class="text-right">${eur(s.cost)}</td><td class="text-right">${fmt(s.kwh)}</td><td class="text-right">${fmt(s.co2)}</td><td class="text-right">+${eur(s.bonus)}</td></tr></tbody></table></div></div>`;

}

/* ---------- Maßnahmenkarten ---------- */
function backLines(m) {
  const l = (m.lines || []).slice();

}
function cardHTML(id, mode, t) {
  const displayCost = t ? effective(m, t, state.sel || []).cost : m.cost;
  const modes = {
    select: 'bg-white border-slate-200 hover:border-eco-500 hover:shadow-md cursor-pointer',
    selected: 'bg-eco-50 border-eco-600 ring-2 ring-eco-500 shadow-md cursor-pointer',
    blocked: 'bg-white border-slate-200 opacity-50 cursor-not-allowed',

    <div class="p-3 flex-1 flex flex-col gap-2">
      ${badge ? `<span class="self-start text-[10px] font-bold px-2 py-0.5 rounded-full ${badge[1]}">${badge[0]}</span>` : ''}
      <div class="font-semibold leading-snug">${esc(m.title)}</div>
      <div class="text-sm text-slate-600">Kosten: <b>${eur(displayCost)}</b>${extra}</div>`;
  if (full) {
    html += `<div class="border-t border-dashed border-slate-300 pt-2 text-xs text-slate-600 leading-relaxed">${esc(m.desc)}</div>
      <ul class="text-xs space-y-0.5 text-slate-700">${backLines(m).map(l => `<li>• ${esc(l)}</li>`).join('')}</ul>`;
    if (impl) html += `<div class="mt-auto rounded-lg ${s.soft} px-2 py-1.5 text-xs"><b>Bei euch angerechnet:</b> ${fmt(impl.kwh)} kWh · ${fmt(impl.co2)} kg CO₂ · +${eur(impl.bonus)} Budget${impl.note ? `<br><span class="text-red-700">${esc(impl.note)}</span>` : ''}</div>`;

}
function waitingCards(t, r) {
  if (r === 1 && t.chosen[1]) return ROUNDS[1].own.filter(id => !t.chosen[1].includes(id));
  if ((r === 2 || r === 3) && t.chosen[2] && t.delDone) return leftover2(t).filter(id => !t.deleted.includes(id));
  if (r >= 4 && t.chosen[4]) return roundPool(t, 4).filter(id => !t.chosen[4].includes(id));
  return [];
}
function sectionHead(title, sub) { return `<div class="mb-3"><h2 class="text-lg font-bold">${title}</h2>${sub ? `<p class="text-sm text-slate-500">${sub}</p>` : ''}</div>`; }

function selectionHTML(t, r, pool) {
  const R = ROUNDS[r]; const sel = state.sel.filter(id => pool.includes(id));
  const avail = r === 3 ? R3_BUDGET : t.budget;
  const totalCost = ids => ids.reduce((s, id) => s + effective(MBY[id], t, ids).cost, 0);
  const cost = totalCost(sel); const rest = avail - cost;
  const err = validateSel(t, r, sel);
  const checks = [[sel.length >= R.min && sel.length <= R.pick, R.min === R.pick ? `Genau ${R.pick} Karten (${sel.length}/${R.pick})` : `1 bis ${R.pick} Karten (${sel.length}/${R.pick})`]]
    .concat(R.req.map(([c, l]) => [sel.some(id => MBY[id].cat === c), `Mind. 1 × ${l}`]))
    .concat([[cost <= avail, `Kosten ${eur(cost)} von ${eur(avail)}${r === 3 ? ' IKT-Sonderbudget' : ''}`]]);
  const cards = pool.map(id => {
    const on = sel.includes(id);
    const candidate = sel.concat(id);
    const blocked = !on && (sel.length >= R.pick || totalCost(candidate) > avail);
    return cardHTML(id, on ? 'selected' : (blocked ? 'blocked' : 'select'), t);
  });
  const sub = {
    1: 'Wählt 3 von 6 Karten. Ihr seht nur die Vorderseite – die Rückseite wird erst nach der Umsetzung sichtbar.',
    2: 'Wählt 3 von 10 Karten (7 neue + 3 aus Runde 1). Pflicht: mindestens 1 × Fuhrpark und 1 × Beleuchtung.',
    3: `Für diese Runde gibt es ein IKT-Sonderbudget von ${eur(R3_BUDGET)} (nur für die Umsetzung). Wählt genau 3 der 4 verfügbaren Karten.`,
    4: 'Wählt 3 von 13 Karten (9 neue + 4 aus Runde 2). Pflicht: mindestens 1 × Heizung und 1 × Wärmedämmung.'
  }[r];
  return box(`${sectionHead(`Runde ${r}: Maßnahmen auswählen`, sub)}
    <div class="sticky top-0 z-20 -mx-4 sm:-mx-5 px-4 sm:px-5 py-2 mb-3 bg-white/95 backdrop-blur border-b border-slate-100 flex flex-wrap items-center gap-2">
      ${checks.map(([ok, l]) => `<span class="text-xs font-semibold px-2 py-1 rounded-full ${ok ? 'bg-eco-100 text-eco-800' : 'bg-slate-100 text-slate-500'}">${ok ? '✓' : '○'} ${l}</span>`).join('')}

    </div>
    ${grid(cards)}`);
}

function measuresHTML(t) {

      if (r === 2 && !t.delDone) out += deletionHTML(t);

}

function modalHTML(t) {
  const q = G().q;

  const opts = it.a.map((a, i) => {

    else if (my === i) cls = 'bg-eco-50 border-eco-600 ring-2 ring-eco-500';
    else if (my !== null || expired) cls = 'bg-white border-slate-200 opacity-50';
    const dis = revealed || my !== null || expired;
    return `<button data-act="answer" data-c="${i}" ${dis ? 'disabled' : ''} class="w-full flex items-start gap-3 text-left p-3 sm:p-4 rounded-xl border-2 transition ${cls} ${dis ? 'cursor-default' : 'cursor-pointer'} focus:outline-none focus-visible:ring-4 focus-visible:ring-eco-400">

  return `<div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3" role="dialog" aria-modal="true" aria-labelledby="q-title">
    <div class="w-full max-w-2xl rounded-2xl bg-white shadow-2xl overflow-hidden fade-in">

    region('r-dash', JSON.stringify([tNoAns, g.round]), () => dashHTML(t));
    region('r-rank', JSON.stringify([TEAMS.map(id => { const x = state.teams[id]; return x && [x.name, x.pos, x.rs, x.cons, x.co2]; }), g.rankings, g.round, state.team]), rankHTML);
    region('r-measures', JSON.stringify([g.round, g.open, t.bilanz, t.chosen, t.impl, t.deleted, t.delDone, t.budget, t.rs, state.sel, state.delSel]), () => measuresHTML(t));
    region('r-modal', JSON.stringify([g.q, t.answer, state.dismissed[g.q && g.q.id], g.q ? isExpired(g.q) : null]), () => modalHTML(t));
  } else if (view === 'admin') {
    region('r-end', JSON.stringify([g.round, g.round >= 5 ? teamsSig : '']), endHTML);
    region('r-side', teamsSig, sideAdminHTML);
    region('r-adm-round', JSON.stringify([g.round, g.open, teamsSig]), adminRoundHTML);
    region('r-adm-qctrl', JSON.stringify([state.qSel, g.sent]), adminQCtrlHTML);
    region('r-adm-qlive', JSON.stringify([g.q, TEAMS.map(id => state.teams[id] && [state.teams[id].name, state.teams[id].answer]), g.q ? isExpired(g.q) : null]), adminQLiveHTML);
    region('r-adm-rank', JSON.stringify([g.round, g.rankings, TEAMS.map(id => state.teams[id] && [state.teams[id].name, state.teams[id].rs, state.teams[id].chosen])]), adminRankHTML);
    region('r-adm-teams', JSON.stringify([g.round, teamsSig]), adminTeamsHTML);
    region('r-adm-danger', 'static', adminDangerHTML);
  }
  positionTokens();
}

function tick() {
  const q = G().q; if (!q) return;
  const rem = remaining(q);
  const txt = q.status === 'open' ? fmtTime(rem) : (q.status === 'revealed' ? 'aufgelöst' : '');
  document.querySelectorAll('[data-timer]').forEach(el => {
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('text-red-400', q.status === 'open' && rem <= 10);
  });
  document.querySelectorAll('[data-timerbar]').forEach(el => { el.style.width = (q.status === 'open' ? rem / QUESTION_SECONDS * 100 : 0) + '%'; });
  const exp = isExpired(q);
  if (exp !== state.lastExpired) { state.lastExpired = exp; render(); }
}

/* =====================================================================
   7. EVENTS
   ===================================================================== */
function setHash(h) { try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* Sandbox */ } }

async function handle(act, el) {
  const d = el ? el.dataset : {};
  switch (act) {
    case 'pick-team': state.role = 'team'; state.team = d.t; state.nameInput = ''; setHash(d.t); render(); break;
    case 'show-admin': state.loginMode = 'admin'; render(); setTimeout(() => { const p = document.getElementById('pw'); if (p) p.focus(); }, 30); break;
    case 'admin-login':
      if (state.pw === ADMIN_PASSWORD) { state.role = 'admin'; state.pw = ''; state.pwErr = false; await ensureGame(); }
      else { state.pwErr = true; sigs['r-login'] = null; }
      render(); break;
    case 'logout': state.role = null; state.team = null; state.loginMode = null; setHash(''); render(); break;
    case 'join': await guarded(joinTeam); break;
    case 'bilanz': await guarded(checkBilanz); break;
    case 'sel-toggle': {
      const id = d.id; const i = state.sel.indexOf(id);
      if (i >= 0) state.sel.splice(i, 1); else state.sel.push(id);
      render(); break;
    }
    case 'sel-submit': if (confirm('Maßnahmen verbindlich umsetzen? Danach ist keine Änderung mehr möglich.')) await guarded(submitMeasures); break;
    case 'del-toggle': {
      const t = state.teams[state.team]; const need = Math.max(0, leftover2(t).length - 4);
      const i = state.delSel.indexOf(d.id);
      if (i >= 0) state.delSel.splice(i, 1); else if (state.delSel.length < need) state.delSel.push(d.id);
      render(); break;
    }
    case 'del-submit': if (confirm('Diese Karten endgültig abgeben?')) await guarded(submitDeletion); break;
    case 'draw': await guarded(drawCard); break;
    case 'ack': await guarded(ackCard); break;
    case 'answer': await guarded(() => answerQuestion(Number(d.c))); break;
    case 'q-dismiss': { const q = G().q; if (q) state.dismissed[q.id] = true; render(); break; }
    // Admin
    case 'round': await setRound(Number(d.r)); break;
    case 'toggle-open': await DB.update('game', { open: !G().open }); break;
    case 'q-send': await sendQuestion(); break;
    case 'q-reveal': await guarded(revealQuestion); break;
    case 'q-close': await closeQuestion(); break;
    case 'rank-eval': await guarded(evaluateRanking); break;
    case 'undo': await guarded(() => undoTeam(d.t)); break;
    case 'judge': await guarded(() => judgeTeamCard(d.t, d.ok === '1')); break;
    case 'move': await guarded(() => manualMove(d.t, Number(d.d))); break;
    case 'reset': await resetGame(); break;
  }
}

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    handle(el.dataset.act, el).catch(err => { console.error(err); alert('Fehler: ' + (err && err.message ? err.message : err)); });
  });
  document.addEventListener('input', e => {
    const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
    const v = e.target.value;
    if (b === 'pw') state.pw = v;
    else if (b === 'name') state.nameInput = v;
    else if (b.indexOf('bf-') === 0) state.bf[b.slice(3)] = v;
  });
  document.addEventListener('change', e => {
    const b = e.target.dataset && e.target.dataset.bind;
    if (b === 'qsel') { state.qSel = e.target.value; render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
    if (b === 'pw') handle('admin-login');
    else if (b === 'name') handle('join');
    else if (b.indexOf('bf-') === 0) handle('bilanz');
  });
  window.addEventListener('resize', () => positionTokens());
}

/* =====================================================================
   8. START
   ===================================================================== */
function boot() {
  DB = createDB();
  const h = (location.hash || '').replace('#', '');
  if (TEAMS.includes(h)) { state.role = 'team'; state.team = h; }
  DB.listen('game', v => { state.game = normGame(v); scheduleRender(); });
  TEAMS.forEach(id => DB.listen('state/' + id, v => { state.teams[id] = parseTeam(v); scheduleRender(); }));
  if (DB.onConnection) DB.onConnection(c => { state.connected = c; scheduleRender(); });
  bindEvents();
  setInterval(tick, 250);
  render();
}
if (typeof window !== 'undefined' && window.document) boot();
</script>
